---
deployment:
  tasks:
    # Publica public/ em public_html. Nao mexe em:
    #  - vendor/  (dependencias: ficam so no servidor, nao no git)
    #  - _data/   (bases DB-IP, mais de 100 MB: so no servidor)
    #  - speedtest/ (LibreSpeed, plano B descartado: nao deve voltar ao servidor)
    - export DEPLOYPATH=/home/vermeuip/public_html/
    - /usr/bin/rsync -rlt --exclude=vendor --exclude=_data --exclude=speedtest public/ $DEPLOYPATH
